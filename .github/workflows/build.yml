name: NexChat Safe Build Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Repo checkout
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Show project structure (debug)
    - name: Show files
      run: |
        echo "PROJECT STRUCTURE:"
        ls -R

    # 3. Run script safely
    - name: Run script.sh
      run: |
        if [ -f script.sh ]; then
          chmod +x script.sh
          ./script.sh
        else
          echo "script.sh not found"
        fi

    # 4. Verify result
    - name: Verify output
      run: |
        echo "AFTER SCRIPT RUN:"
        ls -R

    # 5. Safe placeholder build step
    - name: Build stage (safe)
      run: |
        echo "Build pipeline ready - no crash mode enabled"
