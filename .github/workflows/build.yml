name: NexChat Android CI (Pro Build)

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java environment
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Show project structure (debug)
      - name: List project files
        run: |
          echo "PROJECT STRUCTURE:"
          ls -R

      # 4. Check if Gradle exists (safe guard)
      - name: Check Gradle wrapper
        run: |
          if [ -f "gradlew" ]; then
            echo "Gradle wrapper found"
            chmod +x gradlew
          else
            echo "WARNING: gradlew not found (skipping build)"
          fi

      # 5. Safe build step (only runs if gradlew exists)
      - name: Build Project (if available)
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug
          else
            echo "No Gradle project yet - skipping build"
          fi

      # 6. Upload artifact (only if exists)
      - name: Upload APK (if exists)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NexChat-APK
          path: app/build/outputs/apk/debug/*.apk
